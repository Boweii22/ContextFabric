<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ContextFabric Bridge Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>ContextFabric Bridge</h1>
      <label>
        Daemon URL
        <input data-api-url type="url" placeholder="http://127.0.0.1:7749">
      </label>
      <label>
        App ID
        <input data-app-id type="text" placeholder="browser-extension">
      </label>
      <label>
        Default context query
        <textarea data-default-query rows="4"></textarea>
      </label>
      <label>
        Max brief size, words
        <input data-max-tokens type="number" min="120" max="2000" step="50">
      </label>
      <label>
        <span>
          <input data-enabled type="checkbox">
          Enable bridge
        </span>
      </label>
      <label>
        <span>
          <input data-auto-inject type="checkbox">
          Auto-inject on new chats
        </span>
      </label>
      <div class="actions">
        <button type="button" data-save>Save</button>
        <span data-status></span>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
