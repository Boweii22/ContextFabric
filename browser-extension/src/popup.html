<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ContextFabric Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <strong>ContextFabric</strong>
        <span data-state>Checking...</span>
      </header>
      <p data-message>Looking for the local daemon.</p>
      <label class="toggle">
        <input data-enabled type="checkbox">
        <span>Enable on supported AI chats</span>
      </label>
      <dl>
        <div>
          <dt>Last injected</dt>
          <dd data-last-injected>Never</dd>
        </div>
      </dl>
      <div class="actions">
        <button type="button" data-refresh>Refresh</button>
        <button type="button" data-options>Options</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
